# Production-ready Docker Compose orchestration for Enterprise Inventory Management System (EIMS)
services:
  # 🐍 Django Web Service running Gunicorn
  server:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - TMPDIR=/app/tmp_imports
    volumes:
      - shared_tmp:/app/tmp_imports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 🐘 PostgreSQL Relational Database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=inventory_management_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d inventory_management_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🔴 Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ⚙️ Celery Background Task Worker
  celery_worker:
    build:
      context: .
    command: celery -A core worker --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - TMPDIR=/app/tmp_imports
    volumes:
      - shared_tmp:/app/tmp_imports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ⏰ Celery Beat Scheduler (Periodic Tasks)
  celery_beat:
    build:
      context: .
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

# Persistent volumes for database and cache storage
volumes:
  postgres_data:
  redis_data:
  shared_tmp:
